<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Propostas · Fyw</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/css/proposta-doc.css?v=10">
<style>
@font-face { font-family: 'Google Sans'; font-weight: 300 700; font-display: swap; src: url(/assets/fonts/google-sans-latin.woff2) format('woff2'); }
@font-face { font-family: 'Google Sans'; font-weight: 300 700; font-display: swap; src: url(/assets/fonts/google-sans-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+1E00-1EFF; }
:root { --bg: #0B0B0B; --side: #0F0F0F; --ink: #EEEDE9; --card: #151515; --field: #0B0B0B; --line: rgba(238,237,233,.09); --muted: rgba(238,237,233,.56); --acc: #C8F53C; --or: #FF6A2B; --rd: #FF4D4D; }
:root[data-theme="light"] { --bg: #EEEDE9; --side: #E6E5E0; --ink: #0B0B0B; --card: #F8F7F4; --field: #fff; --line: rgba(11,11,11,.1); --muted: rgba(11,11,11,.56); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: 'Google Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-size: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.btn { color: inherit; height: 36px; padding: 0 16px; border: 0; border-radius: 99px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; white-space: nowrap; font-size: .8125rem; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.btn:hover { box-shadow: inset 0 0 0 1px var(--muted); }
.btn.acc { background: var(--acc); color: #0B0B0B; box-shadow: none; font-weight: 600; }
.btn.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.btn.del:hover { box-shadow: inset 0 0 0 1px var(--rd); color: var(--rd); }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
/* topo */
.topo { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 14px clamp(16px, 2vw, 28px); background: var(--side); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; margin-right: 8px; }
.brand svg { width: 50px; height: 32px; fill: currentColor; }
.brand span { font-size: .6875rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 99px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.tabs a { height: 30px; padding: 0 14px; border-radius: 99px; display: inline-flex; align-items: center; color: var(--muted); text-decoration: none; font-size: .8125rem; white-space: nowrap; }
.tabs a.on { background: var(--ink); color: var(--bg); }
.topo .sp { flex: 1; }
.aviso { margin: 14px clamp(16px, 2vw, 28px) 0; padding: 12px 16px; border-radius: 14px; background: rgba(255,106,43,.12); box-shadow: inset 0 0 0 1px rgba(255,106,43,.35); font-size: .8125rem; line-height: 1.5; }
.aviso b { font-weight: 600; }
/* lista */
.lista { padding: 28px clamp(16px, 2vw, 28px) 48px; }
.lh { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.lh h1 { font-size: clamp(1.8rem, 2.6vw, 2.6rem); font-weight: 500; letter-spacing: -.045em; line-height: 1; }
.lh p { color: var(--muted); font-size: .875rem; margin-top: 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.pc { display: flex; flex-direction: column; border-radius: 22px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.pc .lg { height: 150px; background: #0B0B0B; display: grid; place-items: center; padding: 24px; cursor: pointer; position: relative; overflow: hidden; }
.pc .lg::before { content: ""; position: absolute; width: 240px; height: 200px; right: -80px; top: -110px; border-radius: 50%; background: #C8F53C; opacity: .28; filter: blur(50px); }
.pc .lg::after { content: ""; position: absolute; width: 240px; height: 200px; left: -90px; bottom: -120px; border-radius: 50%; background: #7B5CFF; opacity: .4; filter: blur(50px); }
.pc .lg img { position: relative; z-index: 1; max-width: 70%; max-height: 90px; object-fit: contain; }
.pc .lg span { position: relative; z-index: 1; color: rgba(238,237,233,.5); font-size: .8125rem; }
.pc .in { padding: 18px 20px 20px; display: grid; gap: 6px; flex: 1; }
.pc h3 { font-size: 1.0625rem; font-weight: 500; letter-spacing: -.01em; }
.pc .cl { color: var(--muted); font-size: .875rem; }
.pc .mt { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chipx { height: 26px; padding: 0 10px; border-radius: 99px; display: inline-flex; align-items: center; font-size: .75rem; background: var(--line); white-space: nowrap; }
.chipx.acc { background: var(--acc); color: #0B0B0B; }
.pc .ac { display: flex; gap: 6px; padding: 0 20px 20px; flex-wrap: wrap; }
.vazio { padding: 48px; border-radius: 22px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); text-align: center; }
/* editor */
.ed { display: grid; grid-template-columns: minmax(340px, 460px) minmax(0, 1fr); height: calc(100vh - 65px); }
.form { overflow: auto; padding: 18px clamp(14px, 1.4vw, 22px) 80px; border-right: 1px solid var(--line); display: grid; align-content: start; gap: 10px; scrollbar-width: thin; }
.eh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.eh .st { margin-left: auto; color: var(--muted); font-size: .75rem; white-space: nowrap; }
.eh .st.ok::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: #2BD46A; }
details.bx { border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
details.bx > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 14px 16px; font-weight: 500; }
details.bx > summary::-webkit-details-marker { display: none; }
details.bx > summary i { font-style: normal; font-size: .6875rem; padding: 3px 8px; border-radius: 99px; background: var(--acc); color: #0B0B0B; }
details.bx > summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(45deg); transition: transform .2s; }
details.bx[open] > summary::after { transform: rotate(-135deg); }
.bx .bd { padding: 2px 16px 16px; display: grid; gap: 12px; }
.f { display: grid; gap: 6px; min-width: 0; }
.f > span { font-size: .75rem; color: var(--muted); }
.f input:not([type=checkbox]):not([type=color]):not([type=file]), .f textarea, .f select { width: 100%; min-height: 40px; padding: 9px 12px; border: 0; border-radius: 12px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); outline: none; resize: vertical; line-height: 1.45; }
.f textarea { min-height: 74px; }
.f input:focus, .f textarea:focus, .f select:focus { box-shadow: inset 0 0 0 2px var(--acc); }
.f small { font-size: .6875rem; color: var(--muted); line-height: 1.4; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.chk { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: .875rem; }
.chk input { width: 18px; height: 18px; accent-color: var(--acc); }
.rep { padding: 12px; border-radius: 14px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 10px; }
.rep .rh { display: flex; align-items: center; justify-content: space-between; font-size: .75rem; color: var(--muted); }
.x { height: 28px; padding: 0 10px; border: 0; border-radius: 99px; background: none; box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; font-size: .75rem; color: var(--muted); }
.x:hover { color: var(--rd); box-shadow: inset 0 0 0 1px var(--rd); }
.add { height: 38px; border: 0; border-radius: 12px; background: none; box-shadow: inset 0 0 0 1px dashed var(--line); outline: 1px dashed var(--muted); outline-offset: -1px; cursor: pointer; color: var(--muted); font-size: .8125rem; }
.add:hover { color: var(--ink); }
.up { display: flex; align-items: center; gap: 12px; }
.up .th { width: 120px; height: 72px; border-radius: 12px; background: #0B0B0B; display: grid; place-items: center; padding: 8px; flex: none; }
.up .th img { max-width: 100%; max-height: 100%; object-fit: contain; }
.up .th span { color: rgba(238,237,233,.45); font-size: .6875rem; }
.up .bt { display: grid; gap: 6px; }
.fotos { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fotos .ft { position: relative; }
.fotos img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: block; }
.fotos .ft button { position: absolute; right: -4px; top: -4px; width: 18px; height: 18px; border: 0; border-radius: 50%; background: var(--rd); color: #fff; font-size: 11px; line-height: 18px; cursor: pointer; }
label.btn input[type=file] { display: none; }
/* prévia */
.prev { min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--side); }
.pbar { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pbar p { color: var(--muted); font-size: .75rem; margin-right: auto; }
.pv { overflow: auto; padding: 24px; scrollbar-width: thin; }
.pvs { margin: 0 auto; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.35); border-radius: 6px; overflow: hidden; }
.pvs > .pdoc { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
/* voltar ao padrão, tabela de preços, histórico */
.rs { display: flex; justify-content: flex-end; padding-top: 2px; }
.eh .x { height: 36px; }
summary small { font-size: .75rem; color: var(--muted); font-weight: 400; margin-left: 2px; }
.svx { padding: 14px; border-radius: 14px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 10px; }
.svx .sh { display: flex; gap: 8px; align-items: center; }
.svx .nm { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 0; border-radius: 12px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; font-size: .9375rem; outline: none; }
.svx .nm:focus { box-shadow: inset 0 0 0 2px var(--acc); }
.money { position: relative; display: block; }
.money i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--muted); font-size: .8125rem; pointer-events: none; }
.f .money input { padding-left: 34px !important; font-variant-numeric: tabular-nums; }
.pct { font-size: .75rem; color: var(--muted); min-height: 1em; }
.lh2 { font-size: 1.25rem; font-weight: 500; letter-spacing: -.02em; margin: 44px 0 14px; }
.pc .lg .tt { position: relative; z-index: 1; display: grid; justify-items: center; gap: 2px; color: #EEEDE9; font-size: 1rem; letter-spacing: -.01em; }
.pc .lg .tt b { color: #C8F53C; font-weight: 600; font-size: 2.6rem; letter-spacing: -.04em; line-height: 1; }
.hist { list-style: none; display: grid; gap: 8px; max-width: 920px; }
.hist li { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.hist li > svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; color: var(--muted); }
.hist li div { flex: 1; min-width: 0; display: grid; gap: 2px; }
.hist li b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist li small { color: var(--muted); font-size: .75rem; }
.hnota { margin-top: 10px; color: var(--muted); font-size: .75rem; }
/* tabela de preços */
.trow { display: grid; gap: 10px; }
.trow .g2b { display: grid; grid-template-columns: 1fr 1fr 90px; gap: 10px; }
.soma { font-size: .75rem; color: var(--muted); line-height: 1.5; padding: 10px 12px; border-radius: 12px; background: var(--card); }
@media (max-width: 900px) {
  .ed { grid-template-columns: 1fr; height: auto; }
  .form { border-right: 0; overflow: visible; padding-bottom: 24px; }
  .prev { min-height: 70vh; }
  .pv { padding: 14px; }
  .topo .sp { display: none; }
}
@media (max-width: 420px) { .g3 { grid-template-columns: 1fr 1fr; } .tabs a { padding: 0 10px; } }
/* PDF: só o documento */
#print { display: none; }
@media print {
  html, body { background: #EEEDE9 !important; }
  body > *:not(#print) { display: none !important; }
  #print { display: block !important; position: static !important; left: auto !important; }
  #print .pdoc { position: static; transform: none; }
}
</style>
</head>
<body>
<header class="topo">
  <a class="brand" href="/painel"><svg viewBox="0 0 804 513" aria-label="Fyw"><use href="#fyw-logo"/></svg><span>Painel</span></a>
  <nav class="tabs"><a href="#/" data-v="lista">Propostas</a><a href="#/tabela" data-v="tabela">Tabela de preços</a></nav>
  <span class="sp"></span>
  <a class="btn acc" href="#/nova"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nova proposta</a>
  <button class="btn" id="theme" type="button">Tema</button>
</header>
<div class="aviso" id="aviso" hidden></div>

<main class="lista" id="vlista" hidden>
  <div class="lh"><div><h1>Propostas</h1><p id="lsub">Tudo o que você gerar fica salvo aqui até você excluir.</p></div></div>
  <div class="cards" id="cards"></div>
  <h2 class="lh2">Tabela de preços</h2>
  <div class="cards" id="tabcard"></div>
  <h2 class="lh2">PDFs baixados</h2>
  <div id="hist"></div>
</main>

<main class="ed" id="ved" hidden>
  <form class="form" id="form" autocomplete="off" onsubmit="return false"></form>
  <section class="prev">
    <div class="pbar"><p id="pinfo">Prévia do PDF (página única, 1240 px de largura)</p><button class="btn" type="button" data-pdf><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Baixar PDF</button></div>
    <div class="pv" id="pv"><div class="pvs" id="pvs"></div></div>
  </section>
</main>
