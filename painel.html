<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Fyw</title>
<link rel="icon" href="/favicon.ico">
<style>
@font-face { font-family: 'Google Sans'; font-weight: 300 700; font-display: swap; src: url(/assets/fonts/google-sans-latin.woff2) format('woff2'); }
@font-face { font-family: 'Google Sans'; font-weight: 300 700; font-display: swap; src: url(/assets/fonts/google-sans-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+1E00-1EFF; }
:root { --bg: #0B0B0B; --side: #0F0F0F; --ink: #EEEDE9; --card: #151515; --line: rgba(238,237,233,.09); --muted: rgba(238,237,233,.56); --acc: #C8F53C; --or: #FF6A2B; --bl: #4F7BFF; --gr: #2BD46A; --rd: #FF4D4D; --gap: 12px; }
:root[data-theme="light"] { --bg: #EEEDE9; --side: #E6E5E0; --ink: #0B0B0B; --card: #F8F7F4; --line: rgba(11,11,11,.09); --muted: rgba(11,11,11,.56); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: 'Google Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-size: 14px; }
button, input, select { font: inherit; color: inherit; }
.pill { height: 34px; padding: 0 14px; border: 0; border-radius: 99px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; white-space: nowrap; font-size: .8125rem; }
.pill:hover { box-shadow: inset 0 0 0 1px var(--muted); }
.pill.on { background: var(--ink); color: var(--bg); box-shadow: none; }
select.pill { padding-right: 28px; }
[hidden] { display: none !important; }
/* login */
.login { height: 100%; display: grid; place-items: center; padding: 16px; }
.lcard { width: min(420px, 100%); padding: 36px; border-radius: 28px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 18px; }
.lcard svg { width: 72px; height: 46px; fill: currentColor; }
.lcard h1 { font-size: 2rem; font-weight: 500; letter-spacing: -.04em; }
.lcard p { color: var(--muted); font-size: .9375rem; line-height: 1.5; }
.lcard input { height: 52px; padding: 0 18px; border-radius: 16px; border: 0; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); outline: none; }
.lcard input:focus { box-shadow: inset 0 0 0 2px var(--acc); }
.btn { height: 52px; border: 0; border-radius: 99px; background: var(--acc); color: #0B0B0B; font-weight: 600; cursor: pointer; white-space: nowrap; }
.err { color: var(--or); font-size: .875rem; min-height: 1.2em; }
/* app: uma tela só */
.app { height: 100vh; display: grid; grid-template-columns: 232px minmax(0, 1fr); overflow: hidden; }
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 22px 14px; gap: 18px; min-height: 0; }
.side .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; color: inherit; text-decoration: none; }
.side .brand svg { width: 56px; height: 36px; fill: currentColor; }
.side .brand span { font-size: .6875rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.live { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font-size: .8125rem; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--gr); flex: none; animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(43,212,106,.6); } 70% { box-shadow: 0 0 0 8px rgba(43,212,106,0); } 100% { box-shadow: 0 0 0 0 rgba(43,212,106,0); } }
.nav { display: grid; gap: 2px; overflow: auto; min-height: 0; }
.nav button { display: flex; align-items: center; gap: 11px; width: 100%; height: 40px; padding: 0 12px; border: 0; border-radius: 12px; background: none; cursor: pointer; text-align: left; color: var(--muted); font-size: .875rem; }
.nav button svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav button:hover { color: var(--ink); background: var(--card); }
.nav button.on { color: var(--ink); background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.nav button b { margin-left: auto; font-weight: 500; font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--rd); color: #fff; }
.side .foot { margin-top: auto; display: grid; gap: 10px; }
.per { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border-radius: 99px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.per button { height: 30px; border: 0; border-radius: 99px; background: none; cursor: pointer; font-size: .75rem; color: var(--muted); white-space: nowrap; }
.per button.on { background: var(--ink); color: var(--bg); }
.side .row { display: flex; gap: 6px; } .side .row .pill { flex: 1; }
.main { display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 20px clamp(14px, 1.6vw, 28px) clamp(14px, 1.6vw, 24px); gap: 14px; min-width: 0; min-height: 0; }
.mh { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.mh h1 { font-size: clamp(1.6rem, 2.2vw, 2.4rem); font-weight: 500; letter-spacing: -.045em; line-height: 1; }
.mh p { color: var(--muted); font-size: .8125rem; margin-top: 6px; }
.mh .err { margin: 0; }
/* grade das seções: preenche a altura da tela; o que não couber rola dentro do cartão */
.sec { display: grid; gap: var(--gap); min-height: 0; height: 100%; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
.card { position: relative; display: flex; flex-direction: column; min-height: 0; padding: 16px 18px; border-radius: 20px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.card > h3 { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .6875rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.card > h3 small { letter-spacing: 0; text-transform: none; font-size: .75rem; }
.card .body { flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; }
.span2 { grid-column: span 2; } .span3 { grid-column: span 3; } .rows2 { grid-row: span 2; }
.kpis { grid-column: 1 / -1; display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); }
.kpi { padding: 14px 16px; border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.kpi h4 { font-size: .6875rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi b { display: block; margin-top: 8px; font-size: clamp(1.35rem, 1.7vw, 2.2rem); font-weight: 400; letter-spacing: -.04em; line-height: 1; white-space: nowrap; }
.kpi span { display: block; margin-top: 6px; font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars { list-style: none; display: grid; gap: 9px; }
.bars li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; font-size: .875rem; }
.bars li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars li b { font-weight: 500; font-variant-numeric: tabular-nums; }
.bars li i { grid-column: 1 / -1; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bars li i::after { content: ""; display: block; height: 100%; width: var(--w); border-radius: 99px; background: var(--c, var(--acc)); }
.empty { color: var(--muted); font-size: .875rem; }
.chart { width: 100%; height: 100%; display: block; }
/* redes */
.net { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 150px; }
.net .hd { display: flex; align-items: center; gap: 10px; }
.net .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--c); color: #fff; flex: none; }
.net .ic svg { width: 18px; height: 18px; fill: currentColor; }
.net .hd b { font-size: 1rem; font-weight: 500; }
.net .big { font-size: clamp(1.8rem, 2.4vw, 2.6rem); letter-spacing: -.04em; line-height: 1; }
.net .big small { font-size: .8125rem; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.net dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: auto; }
.net dt { font-size: .6875rem; color: var(--muted); } .net dd { font-size: .9375rem; font-weight: 500; }
.share { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; } .share i { display: block; height: 100%; background: var(--c); }
/* horários */
.hrs { display: grid; grid-template-columns: repeat(24, 1fr); align-items: end; gap: 3px; height: calc(100% - 22px); }
.hrs i { display: block; border-radius: 4px 4px 0 0; background: var(--acc); min-height: 2px; }
.hrsl { display: grid; grid-template-columns: repeat(24, 1fr); font-size: .625rem; color: var(--muted); text-align: center; margin-top: 4px; }
/* desempenho */
.gauge { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.gauge div { padding: 12px; border-radius: 14px; background: var(--bg); }
.gauge b { display: block; font-size: 1.6rem; font-weight: 400; letter-spacing: -.03em; }
.gauge span { font-size: .75rem; color: var(--muted); }
.ok { color: var(--gr); } .warn { color: #FFB020; } .bad { color: var(--rd); }
.dist { display: flex; height: 14px; border-radius: 99px; overflow: hidden; margin: 6px 0 10px; background: var(--line); }
.dist i { display: block; height: 100%; }
/* visitas */
.sess { list-style: none; display: grid; gap: 6px; }
.sess li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--bg); cursor: pointer; }
.sess li:hover, .sess li.on { box-shadow: inset 0 0 0 1px var(--muted); }
.tag { height: 26px; padding: 0 10px; border-radius: 99px; display: inline-flex; align-items: center; font-size: .75rem; background: var(--line); white-space: nowrap; }
.sess .mid { min-width: 0; } .sess .mid b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .sess .mid small { color: var(--muted); font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.sess .r { text-align: right; font-size: .75rem; color: var(--muted); white-space: nowrap; }
.tl { list-style: none; }
.tl li { position: relative; padding: 0 0 14px 22px; font-size: .875rem; }
.tl li::before { content: ""; position: absolute; left: 4px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); }
.tl li::after { content: ""; position: absolute; left: 7.5px; top: 16px; bottom: 0; width: 1px; background: var(--line); }
.tl li.click::before { background: var(--or); } .tl li.leave::before { background: var(--bl); } .tl li.goal::before { background: var(--gr); } .tl li.err::before { background: var(--rd); }
.tl small { display: block; color: var(--muted); font-size: .75rem; margin-top: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
/* erros */
.etab { width: 100%; border-collapse: collapse; font-size: .8125rem; }
.etab th { text-align: left; font-weight: 500; color: var(--muted); font-size: .6875rem; letter-spacing: .08em; text-transform: uppercase; padding: 0 8px 8px 0; position: sticky; top: 0; background: var(--card); }
.etab td { padding: 8px 8px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
.etab td:first-child { max-width: 0; width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* mapa de cliques */
/* a página aparece numa janela do tamanho real (1440 px, reduzida para caber) que acompanha a rolagem; os pontos ficam por cima */
.heatbox { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; border-radius: 14px; background: var(--bg); scrollbar-width: thin; }
.heat { position: relative; margin: 0 auto; }
.heat .vp { position: sticky; top: 0; overflow: hidden; }
.heat iframe { position: absolute; left: 0; top: 0; width: 1440px; border: 0; transform-origin: 0 0; pointer-events: none; background: #fff; }
.heat canvas { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; }
.hbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.note { color: var(--muted); font-size: .75rem; line-height: 1.5; }
/* colunas conforme a largura da tela (ultrawide usa mais colunas) */
@media (min-width: 2200px) { :root { --gap: 14px; } .app { grid-template-columns: 260px minmax(0, 1fr); } }
@media (max-width: 1100px) { .app { grid-template-columns: 200px minmax(0, 1fr); } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; height: auto; min-height: 100vh; overflow: visible; }
  .side { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px; gap: 10px; }
  .nav { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; order: 3; width: 100%; min-width: 0; } .side { min-width: 0; } .side .foot { order: 4; width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 8px; } .side .row .pill { flex: none; }
  .nav button span { display: inline; } .live { order: 2; margin-left: auto; padding: 6px 10px; } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .main { grid-template-rows: auto auto; align-content: start; } .card .chart { height: 160px; }
  .sec { height: auto; grid-template-columns: 1fr !important; grid-template-rows: none !important; grid-auto-rows: auto; }
  .sec > * { grid-column: auto !important; grid-row: auto !important; } .card { max-height: 420px; }
}
</style>
</head>
<body>
<section class="login" id="login" hidden>
  <form class="lcard" id="lform">
    <svg viewBox="0 0 804 513" aria-label="Fyw"><use href="#fyw-logo"/></svg>
    <h1>Entrar</h1>
    <p>Área restrita do painel de visitas da Fyw.</p>
    <input type="password" id="senha" autocomplete="current-password" placeholder="Senha" required>
    <button class="btn" type="submit">Entrar no painel</button>
    <p class="err" id="lerr"></p>
  </form>
</section>

<div class="app" id="app" hidden>
  <aside class="side">
    <a class="brand" href="/"><svg viewBox="0 0 804 513" aria-label="Fyw"><use href="#fyw-logo"/></svg><span>Painel</span></a>
    <div class="live"><i></i><span id="live">0 pessoas agora</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div class="per" id="per"><button data-d="1" type="button">Hoje</button><button class="on" data-d="7" type="button">7d</button><button data-d="30" type="button">30d</button><button data-d="90" type="button">90d</button></div>
      <div class="row"><button class="pill" id="theme" type="button">Tema</button><button class="pill" id="sair" type="button">Sair</button></div>
    </div>
  </aside>
  <main class="main">
    <header class="mh"><div><h1 id="title">Visão geral</h1><p id="sub"></p></div><p class="err" id="aerr"></p></header>
    <div class="sec" id="sec"></div>
  </main>
</div>
